<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Registro de Gastos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f1117; --bg2: #1a1b26; --bg3: #252639;
  --accent: #7c6ff7; --accent2: #a78bfa;
  --text: #e2e8f0; --text2: #94a3b8;
  --success: #22c55e; --danger: #ef4444;
  --border: rgba(255,255,255,0.08);
  --input-bg: rgba(255,255,255,0.05);
  --input-focus: rgba(124,111,247,0.2);
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; font-size: 16px; }

/* HEADER */
.header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px 10px; position: sticky; top: 0; z-index: 100; }
.header-title { font-size: 17px; font-weight: 700; color: var(--accent2); }
.header-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* TABS */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border); display: flex; height: 68px; z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: none; color: var(--text2); font-size: 10px; font-weight: 500; cursor: pointer; transition: color 0.2s; }
.nav-item.active { color: var(--accent2); }
.nav-icon { font-size: 20px; }

/* PAGES */
.page { display: none; padding: 18px 16px; }
.page.active { display: block; }

/* FORM */
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.field input, .field select {
  width: 100%; background: var(--input-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 13px 16px; color: var(--text); font-size: 16px;
  font-family: inherit; outline: none; -webkit-appearance: none; appearance: none; transition: all 0.2s;
}
.field input:focus, .field select:focus { border-color: var(--accent); background: var(--input-focus); }
.field select option { background: #1a1b26; color: var(--text); }

.monto-wrap { position: relative; }
.monto-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--accent2); font-weight: 700; font-size: 16px; pointer-events: none; }
.monto-wrap input { padding-left: 32px; }

.btn-save { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: transform 0.1s, opacity 0.2s; }
.btn-save:active { transform: scale(0.97); opacity: 0.85; }
.btn-save.secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); font-size: 15px; margin-top: 10px; }

/* HISTORIAL */
.hist-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.hist-count { font-size: 13px; color: var(--text2); }
.btn-export { padding: 8px 14px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }

.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.filter-row::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.chip.active { background: rgba(124,111,247,0.25); border-color: var(--accent); color: var(--accent2); }

.expense-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card-desc { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; padding-right: 10px; line-height: 1.35; }
.card-amount { font-size: 15px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; justify-content: space-between; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-cat { background: rgba(124,111,247,0.18); color: var(--accent2); }
.card-date { font-size: 11px; color: var(--text2); }
.card-actions { display: flex; gap: 6px; margin-top: 9px; justify-content: flex-end; }
.btn-edit { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--accent); background: rgba(124,111,247,0.15); color: var(--accent2); font-size: 12px; font-weight: 600; cursor: pointer; }
.btn-del { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--danger); background: rgba(239,68,68,0.1); color: var(--danger); font-size: 12px; font-weight: 600; cursor: pointer; }

/* RESUMEN */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 18px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 15px; }
.stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.stat-value { font-size: 20px; font-weight: 700; color: var(--accent2); line-height: 1.2; }
.stat-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }
.section-title { font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.cat-row { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; }
.cat-name { font-size: 13px; color: var(--text); font-weight: 500; }
.cat-amount { font-size: 14px; font-weight: 700; color: var(--accent2); }
.pct-bar { height: 4px; background: rgba(124,111,247,0.15); border-radius: 4px; margin-top: 5px; overflow: hidden; }
.pct-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; overflow-y: auto; padding: 16px; }
.modal-box { background: var(--bg2); border-radius: 20px; border: 1px solid var(--border); padding: 20px; max-width: 480px; margin: 0 auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-title { font-size: 16px; font-weight: 700; color: var(--accent2); }
.btn-close { border: none; background: none; color: var(--text2); font-size: 24px; cursor: pointer; line-height: 1; }

/* TOAST */
.toast { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%) translateY(16px); background: var(--success); color: #fff; padding: 11px 22px; border-radius: 50px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }

.empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
</style>
</head>
<body>

      <option>Beba</option><option>Capacitacion</option><option>Celulares</option>

      <option>Odontologo</option><option>Oftalmologo</option><option>Open AI</option>

</div>

<!-- HISTORIAL -->
<div class="page" id="page-historial">
  <div class="hist-top">
    <span class="hist-count" id="hist-count">0 registros</span>
    <button class="btn-export" onclick="exportarCSV()">📥 Exportar CSV</button>
  </div>
  <div class="filter-row" id="filter-chips"></div>
  <div id="lista-gastos"></div>
</div>

<!-- RESUMEN -->
<div class="page" id="page-resumen">
  <div class="stats-grid" id="stats-grid"></div>
  <div class="section-title">Por clasificación</div>
  <div id="cat-breakdown"></div>

  <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
    <div class="section-title" style="color:var(--danger)">Zona de peligro</div>
    <button class="btn-save" onclick="resetearTodo()" style="background:rgba(239,68,68,0.15);border:1px solid var(--danger);color:var(--danger);margin-top:0">
      🗑️ Borrar todos los registros
    </button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-nuevo" onclick="showPage('nuevo')">
    <span class="nav-icon">➕</span>Nuevo
  </button>
  <button class="nav-item" id="nav-historial" onclick="showPage('historial')">
    <span class="nav-icon">📋</span>Historial
  </button>
  <button class="nav-item" id="nav-resumen" onclick="showPage('resumen')">
    <span class="nav-icon">📊</span>Resumen
  </button>
</nav>

<!-- MODAL EDICION -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">✏️ Editar Gasto</span>
      <button class="btn-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="field"><label>Fecha</label><input type="date" id="e-fecha" /></div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="e-descripcion" autocomplete="off" />
    </div>
    <div class="field">
      <label>Monto ($)</label>
      <div class="monto-wrap">
        <span class="monto-prefix">$</span>
        <input type="number" id="e-monto" step="0.01" inputmode="decimal" />
      </div>
    </div>
    <div class="field">
      <label>Clasificación</label>
      <select id="e-clasificacion">
        <option value="">Seleccionar...</option>
        <option>ABL</option><option>Ahorro</option><option>Alimentacion</option>
        <option>Alquiler</option><option>Anthropic</option><option>Articulos Hogar</option>
        <option>Beba</option><option>Capacitacion</option><option>Celulares</option>
        <option>Chalk</option><option>Comision Bancaria</option><option>Dermatologo</option>
        <option>Diesmo</option><option>Domestica</option><option>Electricidad</option>
        <option>Entretenimiento</option><option>Expensas</option><option>Gas</option>
        <option>Gastos Personales</option><option>Gestion Documentos</option><option>Gimnasio</option>
        <option>Ginecologo</option><option>Hogar</option><option>Imp. A las Ganancias</option>
        <option>Impuesto Pagado</option><option>Indumentaria</option><option>Internet</option>
        <option>Jubilacion</option><option>Lavanderia</option><option>Ley 19032</option>
        <option>Mary</option><option>Mascota</option><option>Medicinas</option>
        <option>Monotributo</option><option>Mudanza</option><option>Netflix</option>
        <option>Nutricionista</option><option>Obra de Caridad</option><option>Obra Social</option>
        <option>Odontologo</option><option>Oftalmologo</option><option>Open AI</option>
        <option>Ortodoncista</option><option>Planchado</option><option>Podologo</option>
        <option>Prestamos</option><option>Regalos</option><option>Remesa</option>
        <option>Seguros</option><option>Tocador</option><option>Transporte</option>
        <option>Vacaciones</option>
      </select>
    </div>
    <div class="field">
      <label>Método de Pago</label>
      <select id="e-metodo_pago">
        <option value="">Seleccionar...</option>
        <option>Debito</option><option>Efectivo</option>
        <option>Mercado Pago</option><option>Starbucks Card</option>
        <option>TDC Master Card</option><option>TDC Master Card BBVA</option>
        <option>TDC Master Card Galicia</option><option>TDC Master Card ICBC</option>
        <option>TDC Master Card Mercadopago</option><option>TDC Visa</option>
        <option>TDC Visa BBVA</option><option>TDC Visa Galicia</option>
        <option>TDC Visa ICBC</option><option>TDC Visa Naranja</option>
      </select>
    </div>
    <button class="btn-save" onclick="guardarEdicion()">💾 Guardar Cambios</button>
    <button class="btn-save secondary" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'registro_gastos_v1';
let gastos = [];
let activeFilter = 'Todos';
let editingId = null;

function init() {
  const s = localStorage.getItem(KEY);
  gastos = s ? JSON.parse(s) : [];
  document.getElementById('fecha').value = hoy();
  updateHeader();
}

function hoy() { return new Date().toISOString().split('T')[0]; }
function save() { localStorage.setItem(KEY, JSON.stringify(gastos)); }

function updateHeader() {
  const total = gastos.reduce((s, g) => s + (g.monto || 0), 0);
  document.getElementById('header-sub').textContent =
    `${gastos.length} registros · Total $${fmtARS(total)}`;
}

function fmtARS(n) {
  return Math.abs(n) >= 1000
    ? n.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 })
    : n.toFixed(2);
}

function fmtFecha(f) {
  if (!f) return '';
  const [y, m, d] = f.split('-');
  return `${d}/${m}/${y}`;
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  document.getElementById('nav-' + p).classList.add('active');
  if (p === 'historial') renderHistorial();
  if (p === 'resumen') renderResumen();
}

function guardar() {
  const fecha = document.getElementById('fecha').value;
  const descripcion = document.getElementById('descripcion').value.trim();
  const monto = parseFloat(document.getElementById('monto').value);
  const clasificacion = document.getElementById('clasificacion').value;
  const metodo_pago = document.getElementById('metodo_pago').value;

  if (!fecha) return showToast('Ingresá la fecha', true);
  if (!descripcion) return showToast('Ingresá una descripción', true);
  if (isNaN(monto)) return showToast('Ingresá un monto válido', true);
  if (!clasificacion) return showToast('Seleccioná una clasificación', true);
  if (!metodo_pago) return showToast('Seleccioná el método de pago', true);

  gastos.push({ id: Date.now(), fecha, descripcion, monto, clasificacion, metodo_pago });
  save();
  updateHeader();
  showToast('✓ Gasto guardado');

  document.getElementById('descripcion').value = '';
  document.getElementById('monto').value = '';
  document.getElementById('clasificacion').value = '';
  document.getElementById('metodo_pago').value = '';
  document.getElementById('fecha').value = hoy();
}

function renderHistorial() {
  const cats = ['Todos', ...new Set(gastos.map(g => g.clasificacion).filter(Boolean))].sort();
  document.getElementById('filter-chips').innerHTML = cats.map(c =>
    `<button class="chip${c === activeFilter ? ' active' : ''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');

  const filtered = activeFilter === 'Todos' ? gastos : gastos.filter(g => g.clasificacion === activeFilter);
  document.getElementById('hist-count').textContent = `${filtered.length} registros`;

  if (!filtered.length) {
    document.getElementById('lista-gastos').innerHTML =
      `<div class="empty-state"><div class="empty-icon">📭</div><p>Sin registros aún</p></div>`;
    return;
  }

  const sorted = [...filtered].sort((a, b) => b.fecha.localeCompare(a.fecha));
  document.getElementById('lista-gastos').innerHTML = sorted.map(g => `
    <div class="expense-card">
      <div class="card-top">
        <div class="card-desc">${g.descripcion}</div>
        <div class="card-amount">$${fmtARS(g.monto)}</div>
      </div>
      <div class="card-meta">
        <span class="badge badge-cat">${g.clasificacion}</span>
        <span class="card-date">${fmtFecha(g.fecha)} · ${g.metodo_pago}</span>
      </div>
      <div class="card-actions">
        <button class="btn-edit" onclick="editarGasto(${g.id})">✏️ Editar</button>
        <button class="btn-del" onclick="eliminarGasto(${g.id})">🗑️</button>
      </div>
    </div>`).join('');
}

function setFilter(c) { activeFilter = c; renderHistorial(); }

function renderResumen() {
  const total = gastos.reduce((s, g) => s + (g.monto || 0), 0);
  const positivos = gastos.filter(g => g.monto > 0).reduce((s, g) => s + g.monto, 0);
  const negativos = gastos.filter(g => g.monto < 0).reduce((s, g) => s + g.monto, 0);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Total Neto</div>
      <div class="stat-value">$${fmtARS(total)}</div>
      <div class="stat-sub">pesos</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Registros</div>
      <div class="stat-value">${gastos.length}</div>
      <div class="stat-sub">gastos</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Egresos</div>
      <div class="stat-value">$${fmtARS(positivos)}</div>
      <div class="stat-sub">salidas</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Devoluciones</div>
      <div class="stat-value">$${fmtARS(Math.abs(negativos))}</div>
      <div class="stat-sub">ingresos/ajustes</div>
    </div>`;

  const byCat = {};
  gastos.forEach(g => {
    const c = g.clasificacion || 'Sin clasificar';
    byCat[c] = (byCat[c] || 0) + (g.monto || 0);
  });
  const sorted = Object.entries(byCat).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const maxAbs = sorted.length ? Math.abs(sorted[0][1]) : 1;

  document.getElementById('cat-breakdown').innerHTML = sorted.map(([cat, amt]) => `
    <div class="cat-row">
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="cat-name">${cat}</span>
          <span class="cat-amount" style="color:${amt < 0 ? 'var(--success)' : 'var(--accent2)'}">$${fmtARS(amt)}</span>
        </div>
        <div class="pct-bar"><div class="pct-fill" style="width:${(Math.abs(amt)/maxAbs*100).toFixed(1)}%"></div></div>
      </div>
    </div>`).join('');
}

function editarGasto(id) {
  const g = gastos.find(x => x.id === id);
  if (!g) return;
  editingId = id;
  document.getElementById('e-fecha').value = g.fecha;
  document.getElementById('e-descripcion').value = g.descripcion;
  document.getElementById('e-monto').value = g.monto;
  document.getElementById('e-clasificacion').value = g.clasificacion;
  document.getElementById('e-metodo_pago').value = g.metodo_pago;
  document.getElementById('modal-overlay').style.display = 'block';
}

function cerrarModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  editingId = null;
}

function guardarEdicion() {
  const fecha = document.getElementById('e-fecha').value;
  const descripcion = document.getElementById('e-descripcion').value.trim();
  const monto = parseFloat(document.getElementById('e-monto').value);
  const clasificacion = document.getElementById('e-clasificacion').value;
  const metodo_pago = document.getElementById('e-metodo_pago').value;

  if (!fecha) return showToast('Ingresá la fecha', true);
  if (!descripcion) return showToast('Ingresá una descripción', true);
  if (isNaN(monto)) return showToast('Ingresá un monto válido', true);
  if (!clasificacion) return showToast('Seleccioná una clasificación', true);
  if (!metodo_pago) return showToast('Seleccioná el método de pago', true);

  const idx = gastos.findIndex(x => x.id === editingId);
  if (idx === -1) return;
  gastos[idx] = { ...gastos[idx], fecha, descripcion, monto, clasificacion, metodo_pago };
  save();
  updateHeader();
  cerrarModal();
  renderHistorial();
  showToast('✓ Gasto actualizado');
}

function eliminarGasto(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  gastos = gastos.filter(g => g.id !== id);
  save();
  updateHeader();
  renderHistorial();
  renderResumen();
  showToast('🗑️ Registro eliminado');
}

function exportarCSV() {
  const headers = ['Fecha', 'Descripcion', 'Monto', 'Clasificacion', 'Metodo de Pago'];
  const rows = gastos.map(g => [g.fecha, g.descripcion, g.monto, g.clasificacion, g.metodo_pago]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Gastos_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showToast('📥 CSV descargado');
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '') + ' show';
  setTimeout(() => t.className = 'toast' + (error ? ' error' : ''), 2300);
}

function resetearTodo() {
  if (!confirm('¿Borrar TODOS los registros? Esta acción no se puede deshacer.')) return;
  if (!confirm('Segunda confirmación: ¿Estás seguro? Se eliminarán todos los datos.')) return;
  gastos = [];
  save();
  updateHeader();
  renderResumen();
  showToast('🗑️ Todos los registros eliminados');
}

init();
</script>
</body>
</html>
